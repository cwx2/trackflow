spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/trackflow
    username: trackflow
    password: trackflow123
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 16379
      database: 0
      timeout: 3s
      connect-timeout: 2s
      lettuce:
        pool:
          enabled: true
          max-active: 8
          max-idle: 8
          min-idle: 0

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/trackflow
          jwk-set-uri: http://localhost:8080/realms/trackflow/protocol/openid-connect/certs
          audiences: ${KEYCLOAK_AUDIENCE:account}

  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
    livereload:
      enabled: false

keycloak:
  admin:
    server-url: http://localhost:8080
    realm: trackflow
    client-id: trackflow-backend
    client-secret: trackflow-backend-secret

minio:
  endpoint: http://localhost:9000
  access-key: trackflow
  secret-key: trackflow123
  bucket: trackflow

knife4j:
  enable: true

logging:
  level:
    com.trackflow: DEBUG
    org.springframework.security: DEBUG

# TrackFlow custom settings
trackflow:
  security:
    # 启动时检查所有 Controller 端点是否有授权注解
    # false = 仅打印 WARN 日志；true = 缺失注解时阻断启动（生产环境建议 true）
    enforce-authorization-check: false
