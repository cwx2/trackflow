spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/trackflow}
    username: ${DB_USERNAME:trackflow}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI}
          audiences: ${KEYCLOAK_AUDIENCE:account}

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:trackflow}

knife4j:
  enable: false

logging:
  level:
    com.trackflow: INFO
    org.springframework.security: WARN

# TrackFlow 生产配置
trackflow:
  security:
    # 生产环境强制检查：缺失授权注解的端点将阻断启动（fail-fast）
    enforce-authorization-check: true
  cors:
    # 生产环境必须通过 TRACKFLOW_CORS_ORIGINS 环境变量配置前端域名
    # 多个域名用逗号分隔，如: https://trackflow.company.com,https://admin.company.com
    allowed-origins: ${TRACKFLOW_CORS_ORIGINS}
