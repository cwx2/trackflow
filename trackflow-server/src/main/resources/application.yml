server:
  port: 8090
  servlet:
    context-path: /

spring:
  application:
    name: trackflow-server
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    placeholder-replacement: false
    out-of-order: true
    ignore-migration-patterns: "*:missing"

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.trackflow.**.entity
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deletedAt
      logic-delete-value: "NOW()"
      logic-not-delete-value: "NULL"
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.trackflow: INFO
    org.springframework.security: INFO

# 附件上传限制
trackflow:
  cors:
    allowed-origins: http://localhost:3000
  attachment:
    max-file-size: 52428800  # 50MB
    max-attachments-per-issue: 50
    blocked-extensions:
      - exe
      - bat
      - cmd
      - sh
      - ps1
      - vbs
      - js
      - msi
      - dll
      - com
      - scr
      - pif
      - hta
      - cpl
      - inf
      - reg
      - ws
      - wsf
      - wsc
      - lnk
  notification:
    aggregation-minutes: 5  # 通知聚合时间窗口（分钟）
  base-url: http://localhost:3000  # 前端基础 URL，用于邮件中的资源直链
  encryption:
    key: dHJhY2tmbG93LWFlczI1Ni1lbmNyeXB0LWtleTAxMjM=  # Base64 encoded 32-byte key (override in production!)
